# Copiar como .streamlit/secrets.toml y completar SOLO en el servidor.
# No contiene credenciales reales. OPENAI_API_KEY tiene prioridad sobre api_key.
[chat]
model = "gpt-5.5"
# api_key = "completar-en-servidor"
timeout = 40
max_tokens = 2000
session_ttl = 1800

[access]
mode = "local" # Solo loopback. Para acceso compartido usar "oidc".

[access.local]
personal = false # Habilitar explícitamente para consultar Documento y mostrar PII.
detail = true
audit = true

# OIDC: configurar el proveedor y los usuarios antes de exponer el servidor.
# [auth]
# redirect_uri = "http://localhost:8501/oauth2callback"
# cookie_secret = "generar-un-secreto-aleatorio"
# client_id = "..."
# client_secret = "..."
# server_metadata_url = "https://proveedor/.well-known/openid-configuration"
#
# Clave: issuer EXACTO + "|" + sub del proveedor verificado (no email declarado).
# [access.users."https://issuer.example|subject-verificado"]
# personal = false
# detail = true
# audit = false
# sources = ["prestamos", "cobranzas", "cartera"]
# entities = ["Entidad autorizada"]
# branches = ["Sucursal autorizada"]
# Omitir un alcance permite todas sus opciones; lista vacía no permite ninguna.
# Fuentes gerenciales sin dimensión suficiente se bloquean con alcance parcial.
